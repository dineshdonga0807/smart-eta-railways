services:
  smart-eta:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-eta:latest
    container_name: smart_eta_app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
